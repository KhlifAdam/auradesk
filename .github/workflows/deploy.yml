name: Deploy

on:
  push:
    branches: [main]

# Two deploys never run at once, and a running one is never cancelled halfway.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Must match the image names in docker-compose.prod.yml (GHCR needs lowercase).
  IMAGE: ghcr.io/khlifadam/auradesk
  DEPLOY_DIR: /opt/auradesk

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # TODO: add `environment: production` (secrets limited to `main`) once an admin can create it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Every later ssh/scp call just uses `vps`.
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # Optional secret; SSH defaults to 22.
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

      - name: Upload stack files
        run: |
          SSH="ssh vps"
          scp docker-compose.prod.yml deploy/public.env scripts/deploy.sh "vps:$DEPLOY_DIR/"
          # Owner-only files: the env holds every secret, the token pulls the private images.
          printf '%s\n' "$PRODUCTION_ENV" | $SSH "umask 077; cat > $DEPLOY_DIR/.env.new"
          printf '%s' "$GHCR_TOKEN" | $SSH "umask 077; cat > $DEPLOY_DIR/.ghcr-token"
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          ssh vps \
            "IMAGE_TAG=${{ github.sha }} GHCR_USER=${{ github.actor }} bash $DEPLOY_DIR/deploy.sh"
