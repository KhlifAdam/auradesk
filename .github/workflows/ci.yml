name: CI

on:
  pull_request:
  push:
    branches: [dev]
  # Reused by the deploy workflow as its gate.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check
      - run: pnpm typecheck
      - run: pnpm test

  # Proves the image still builds. The deploy workflow builds and pushes the real one.
  docker:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          build-args: R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
