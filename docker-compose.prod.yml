# Production stack. Run from the deploy directory, next to the `.env` written by the workflow.
name: auradesk

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - auradesk_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off: applies pending migrations, then exits. The app only starts if it succeeds.
  migrate:
    image: ghcr.io/khlifadam/auradesk-migrate:${IMAGE_TAG}
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/khlifadam/auradesk:${IMAGE_TAG}
    env_file: .env
    environment:
      <<: *database-url
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  auradesk_db_data:
