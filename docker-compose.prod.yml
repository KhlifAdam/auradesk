# Production stack. Run from the deploy directory, next to the `.env` written by the workflow.
name: auradesk

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - auradesk_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off: applies pending migrations, then exits. The app only starts if it succeeds.
  migrate:
    image: ghcr.io/khlifadam/auradesk-migrate:${IMAGE_TAG}
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/khlifadam/auradesk:${IMAGE_TAG}
    env_file: [public.env, .env]
    environment:
      <<: *database-url
      WA_GATEWAY_URL: http://wa-gateway:4000
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Holds the one WhatsApp connection (Baileys). No published port: only `app`
  # reaches it. Its own container, so app deploys don't drop the WhatsApp link.
  wa-gateway:
    # Tagged by the gateway's sources: it is only recreated when they change.
    image: ghcr.io/khlifadam/auradesk-wa-gateway:${WA_GATEWAY_TAG}
    environment:
      WA_GATEWAY_SECRET: ${WA_GATEWAY_SECRET}
      APP_WEBHOOK_URL: http://app:3000/api/internal/whatsapp
    volumes:
      # The WhatsApp session keys: losing them means scanning a new QR code.
      - auradesk_wa_auth:/data
    restart: unless-stopped

volumes:
  auradesk_db_data:
  auradesk_wa_auth:
