services:
  db:
    image: postgres:18
    container_name: auradesk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - auradesk_db_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  auradesk_db_data:
